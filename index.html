<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伺服器即時壓測與異常監控</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; margin-top: 0; color: #38bdf8; }
        .config-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; }
        button { padding: 10px 20px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0ea5e9; }
        button.stop { background: #dc2626; }
        button.stop:hover { background: #ef4444; }
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .card { background: #0f172a; padding: 16px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .card h3 { margin: 0 0 8px 0; font-size: 14px; color: #94a3b8; }
        .card p { margin: 0; font-size: 20px; font-weight: bold; }
        .status-banner { padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 16px; }
        .status-normal { background: #065f46; color: #a7f3d0; }
        .status-warning { background: #9a3412; color: #fed7aa; }
        .status-danger { background: #991b1b; color: #fecaca; }
        .log-box { background: #0f172a; padding: 12px; border-radius: 8px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; border: 1px solid #334155; }
        .log-item { margin-bottom: 4px; }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ 伺服器異常與負載監控器</h1>
        
        <div class="config-box">
            <input type="text" id="targetUrl" value="http://127.0.0.1:8000" placeholder="輸入要監控的網址...">
            <button id="toggleBtn" onclick="toggleMonitor()">開始監控</button>
        </div>

        <div id="statusBanner" class="status-banner status-normal">
            狀態：尚未啟動監控
        </div>

        <div class="metrics-grid">
            <div class="card">
                <h3>當前延遲</h3>
                <p id="latMetric">0 ms</p>
            </div>
            <div class="card">
                <h3>平均延遲</h3>
                <p id="avgLatMetric">0 ms</p>
            </div>
            <div class="card">
                <h3>成功率</h3>
                <p id="successRateMetric">100%</p>
            </div>
            <div class="card">
                <h3>失敗/逾時數</h3>
                <p id="failCountMetric">0</p>
            </div>
        </div>

        <h3>即時檢測日誌</h3>
        <div id="logBox" class="log-box"></div>
    </div>

    <script>
        let isRunning = false;
        let intervalId = null;
        let totalRequests = 0;
        let failCount = 0;
        let latencies = [];

        function toggleMonitor() {
            const btn = document.getElementById('toggleBtn');
            const urlInput = document.getElementById('targetUrl');

            if (!isRunning) {
                if (!urlInput.value) { alert('請輸入目標網址'); return; }
                isRunning = true;
                btn.textContent = '停止監控';
                btn.className = 'stop';
                urlInput.disabled = true;
                totalRequests = 0;
                failCount = 0;
                latencies = [];
                
                addLog('[*] 開始監控伺服器回應狀況...', 'success');
                runCheck();
                intervalId = setInterval(runCheck, 1000); // 每秒發送一次探測請求
            } else {
                isRunning = false;
                clearInterval(intervalId);
                btn.textContent = '開始監控';
                btn.className = '';
                urlInput.disabled = false;
                updateStatus('normal', '狀態：已停止監控');
                addLog('[*] 監控已手動停止。', '');
            }
        }

        async function runCheck() {
            const url = document.getElementById('targetUrl').value;
            const startTime = performance.now();
            totalRequests++;

            try {
                // 使用無快取機制確保每次都是真實請求伺服器
                const response = await fetch(url + '?_t=' + Date.now(), {
                    method: 'GET',
                    mode: 'no-cors', // 避免跨域阻擋，但注意 no-cors 無法讀取正確 status
                    cache: 'no-store'
                });
                
                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);
                latencies.push(latency);
                if (latencies.length > 30) latencies.shift(); // 保留最近 30 筆

                // 檢查是否延遲過高
                evaluateHealth(latency, false);
                addLog(`[OK] 請求成功 - 延遲: ${latency} ms`, 'log-success');

            } catch (error) {
                failCount++;
                evaluateHealth(0, true);
                addLog(`[ERROR] 請求失敗/伺服器無回應 (可能遭遇 DDoS 或掛掉)`, 'log-error');
            }

            updateMetrics();
        }

        function evaluateHealth(latestLat, isError) {
            const banner = document.getElementById('statusBanner');
            const failRate = (failCount / totalRequests) * 100;

            if (isError || failRate > 30) {
                updateStatus('danger', '🚨 警告：伺服器無回應或可能正遭受強烈 DDoS 攻擊 / 癱瘓！');
            } else if (latestLat > 800 || failRate > 10) {
                updateStatus('warning', '⚠️ 注意：伺服器回應緩慢，可能正承受高負載或頻寬壓力。');
            } else {
                updateStatus('normal', '🟢 狀態正常：伺服器運行順暢');
            }
        }

        function updateStatus(type, text) {
            const banner = document.getElementById('statusBanner');
            banner.className = `status-banner status-${type}`;
            banner.textContent = text;
        }

        function updateMetrics() {
            if (latencies.length > 0) {
                const current = latencies[latencies.length - 1];
                const avg = Math.round(latencies.reduce((a, b) => a + b, 0) / latencies.length);
                document.getElementById('latMetric').textContent = current + ' ms';
                document.getElementById('avgLatMetric').textContent = avg + ' ms';
            }
            const successRate = totalRequests > 0 ? Math.round(((totalRequests - failCount) / totalRequests) * 100) : 100;
            document.getElementById('successRateMetric').textContent = successRate + '%';
            document.getElementById('failCountMetric').textContent = failCount;
        }

        function addLog(message, className) {
            const logBox = document.getElementById('logBox');
            const timeStr = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log-item ${className}`;
            div.textContent = `[${timeStr}] ${message}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>
